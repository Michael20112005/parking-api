services:
  db:
    image: postgres:15
    container_name: parking-db
    restart: always
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"

  api:
    build: .
    container_name: parking-api
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: parking
      DB_USER: postgres
      DB_PASSWORD: 1234
      DB_SYNC: "false"
      SWAGGER_SERVER_URL: http://localhost:3000